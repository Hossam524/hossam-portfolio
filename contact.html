<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>تواصل مع الحسام حسن | قنوات الاتصال الرسمية</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary-dark: #0f172a;
        --accent-blue: #3b82f6;
        --accent-purple: #8b5cf6;
        --text-light: #f8fafc;
        --text-muted: #94a3b8;
        --card-bg: #1e293b;
        --glass: rgba(30, 41, 59, 0.7);
        --border-color: rgba(255, 255, 255, 0.1);
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--primary-dark);
        color: var(--text-light);
        font-family: "Tajawal", sans-serif;
        background-image: radial-gradient(
          circle at 50% 0%,
          rgba(59, 130, 246, 0.15) 0%,
          transparent 50%
        );
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .container {
        width: 100%;
        max-width: 800px;
        padding: 40px 20px;
        text-align: center;
      }

      .grad-text {
        background: linear-gradient(135deg, #60a5fa, #c084fc);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: inline-block;
        font-weight: 900;
        font-size: 2.8rem;
        margin-bottom: 10px;
      }

      .subtitle {
        color: var(--text-muted);
        margin-bottom: 40px;
        font-size: 1.1rem;
      }

      .contact-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }

      .contact-card {
        background: var(--glass);
        backdrop-filter: blur(15px);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        padding: 25px;
        text-decoration: none;
        color: white;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }

      .contact-card:hover {
        transform: translateY(-10px);
        border-color: var(--accent-blue);
        box-shadow: 0 15px 35px rgba(59, 130, 246, 0.2);
        background: rgba(30, 41, 59, 0.9);
      }

      .icon-box {
        width: 60px;
        height: 60px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        transition: 0.3s;
      }

      .contact-card:hover .icon-box {
        background: var(--accent-blue);
        transform: rotate(10deg);
      }

      .contact-info h3 {
        margin: 0;
        font-size: 1.2rem;
        color: #93c5fd;
      }

      .contact-info p {
        margin: 5px 0 0;
        color: var(--text-light);
        font-weight: 500;
        font-size: 1rem;
      }

      .btn-back {
        text-decoration: none;
        color: var(--text-muted);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 50px;
        font-weight: 500;
        transition: 0.3s;
      }

      .btn-back:hover {
        color: var(--accent-blue);
      }

      @media (max-width: 600px) {
        .grad-text {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1 class="grad-text">تواصل مع الحسام حسن</h1>
      <p class="subtitle">
        يسعدني الرد على استفساراتكم التربوية والبرمجية عبر القنوات التالية:
      </p>

      <div class="contact-grid">
        <a href="tel:01508178093" class="contact-card">
          <div class="icon-box">📞</div>
          <div class="contact-info">
            <h3>اتصال هاتفي</h3>
            <p>01508178093</p>
          </div>
        </a>

        <a
          href="https://t.me/MrHossamHassn"
          target="_blank"
          class="contact-card"
        >
          <div class="icon-box">✈️</div>
          <div class="contact-info">
            <h3>تلجرام</h3>
            <p>@MrHossamHassn</p>
          </div>
        </a>

        <a
          href="https://www.facebook.com/share/1S6NXDEkMZ/"
          target="_blank"
          class="contact-card"
        >
          <div class="icon-box">💙</div>
          <div class="contact-info">
            <h3>فيسبوك</h3>
            <p>الحساب الرسمي</p>
          </div>
        </a>

        <a href="mailto:hojhhgk@gmail.com" class="contact-card">
          <div class="icon-box">📧</div>
          <div class="contact-info">
            <h3>البريد الإلكتروني</h3>
            <p>hojhhgk@gmail.com</p>
          </div>
        </a>
      </div>

      <a href="index.html" class="btn-back">⬅ العودة إلى الصفحة الرئيسية</a>
    </main>

    <footer
      style="
        margin-top: auto;
        padding: 40px;
        color: var(--text-muted);
        font-size: 0.9rem;
      "
    >
      <p>© 2026 الحسام حسن | جميع الحقوق محفوظة</p>
    </footer>
  </body>
</html>
